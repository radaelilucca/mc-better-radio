buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'idea'
    id 'net.minecraftforge.gradle'
}

apply plugin: 'org.spongepowered.mixin'

base {
    archivesName = "${mod_id}-forge"
}

version = "${mod_version}+${forge_minecraft_version}"

sourceSets {
    main {
        java.srcDir('../common/src/main/java')
        resources.srcDir('../common/src/main/resources')
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(forge_java_version as int)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: forge_minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('runs/client')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mixin.config', 'better_radio.forge.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('runs/server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'better_radio.forge.refmap.json'
    config 'better_radio.forge.mixins.json'
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    def properties = [
        version: "${mod_version}+${forge_minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: forge_minecraft_version,
        forge_version: forge_version,
        forge_loader_version_range: forge_loader_version_range,
        forge_minecraft_version_range: forge_minecraft_version_range
    ]
    inputs.properties(properties)
    filesMatching('META-INF/mods.toml') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = forge_java_version as int
}

jar {
    manifest {
        attributes('MixinConfigs': 'better_radio.forge.mixins.json')
    }
}

// Forge's development scanner needs a source set's classes and resources to
// resolve as one local mod root when common sources are included directly.
sourceSets.each {
    def outputDirectory = layout.buildDirectory.dir("sourceSets/${it.name}")
    it.output.resourcesDir = outputDirectory
    it.java.destinationDirectory = outputDirectory
}
