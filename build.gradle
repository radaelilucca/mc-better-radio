plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' apply false
    id 'net.neoforged.moddev' version '2.0.140' apply false
}

allprojects {
    group = mod_group_id
    version = mod_version
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds the common, Forge 1.20.1, and NeoForge 1.21.1 artifacts.'
    dependsOn(':common:check', ':forge:build', ':neoforge:build')
}
