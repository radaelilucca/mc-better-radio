name: Auto tag main

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.version.outputs.created }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: version
        name: Calculate and push the next semantic tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          initial_version="$(sed -nE 's/^mod_version=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' gradle.properties)"
          test -n "$initial_version"
          latest_tag="$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n 1)"

          if [[ -z "$latest_tag" ]]; then
            next="v$initial_version"
          else
            commits="$(git log "$latest_tag..HEAD" --format=%B)"
            if grep -Eq '(^|[[:space:]])(BREAKING CHANGE|BREAKING-CHANGE):|^[[:alpha:]]+(\([^)]+\))?!:' <<< "$commits"; then
              change=major
            elif grep -Eq '^feat(\([^)]+\))?:' <<< "$commits"; then
              change=minor
            elif grep -Eq '^(fix|perf)(\([^)]+\))?:' <<< "$commits"; then
              change=patch
            else
              echo 'created=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            case "$change" in
              major)
                if (( major == 0 )); then ((minor += 1)); else ((major += 1)); minor=0; fi
                patch=0
                ;;
              minor) ((minor += 1)); patch=0 ;;
              patch) ((patch += 1)) ;;
            esac
            next="v$major.$minor.$patch"
          fi

          git tag --annotate "$next" --message "Release $next"
          git push origin "$next"
          echo 'created=true' >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release-on-tag.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
