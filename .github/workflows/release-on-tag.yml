name: Build release tag

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Newly created semantic tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag and build all supported loaders
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chmod +x ./gradlew
          ./gradlew -Pmod_version="${RELEASE_TAG#v}" buildAll --no-daemon --no-parallel --console=plain
      - name: Collect release JARs
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-artifacts
          cp "forge/build/libs/better_radio-forge-${version}.jar" "release-artifacts/better-radio-${version}-forge.jar"
          cp "neoforge/build/libs/better_radio-neoforge-${version}.jar" "release-artifacts/better-radio-${version}-neoforge.jar"
          test "$(find release-artifacts -type f | wc -l)" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: better-radio-${{ env.RELEASE_TAG }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --title "Better Radio $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-artifacts/*.jar --clobber
